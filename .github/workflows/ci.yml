name: CI

on:
  push:
    branches: [main, "claude/greyhound-prediction-app-4vNeO"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install pinned dependencies
        run: |
          pip install -r requirements.lock
          pip install pytest pytest-asyncio
      - name: Fresh-database migration check
        run: |
          DATABASE_URL="sqlite:///$RUNNER_TEMP/fresh.db" python -m alembic upgrade head
      - name: Run tests
        run: python -m pytest tests/ -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build (includes TypeScript check)
        run: npm run build
