[project]
name = "greyhound-predictor"
version = "0.1.3"
description = "Irish greyhound race prediction app"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<1",
    "uvicorn[standard]>=0.30.0,<1",
    "sqlalchemy>=2.0.0,<3",
    "alembic>=1.13.0,<2",
    "pydantic>=2.0.0,<3",
    "pydantic-settings>=2.0.0,<3",
    "aiosqlite>=0.20.0,<1",
    "httpx>=0.27.0,<1",
    "pandas>=2.2.0,<4",
    "numpy>=1.26.0,<3",
    "beautifulsoup4>=4.12.0,<5",
    "xgboost>=2.0.0,<4",
    "lightgbm>=4.3.0,<5",
    "scikit-learn>=1.4.0,<2",
    "optuna>=3.6.0,<5",
    "shap>=0.45.0,<1",
    "apscheduler>=3.10.0,<4",
    "RestrictedPython>=7.0,<9",
    "boto3>=1.34.0,<2",
    "sentry-sdk[fastapi]>=2.0,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
include = ["app*", "scraping*", "ml*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["alembic/versions"]

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes core; I: import order left off (too churny
# for now); B: bugbear correctness; UP: keep syntax modern.
select = ["E", "F", "B"]
ignore = [
    "E501",  # line length: legacy code has long strings; not worth the churn
    "E402",  # module-import-not-at-top: scripts adjust sys.path first
    "B008",  # FastAPI Depends() in defaults is the framework idiom
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
